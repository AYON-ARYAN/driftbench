[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftbench"
version = "0.1.0"
description = "A benchmark measuring whether AI coding agents silently break API contracts"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayon Aryan" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flask>=3.0"]

[project.scripts]
driftbench = "driftbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/fixtures"]
