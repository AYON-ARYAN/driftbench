openapi: 3.0.3
info: {title: minisvc, version: "1.0.0"}
paths:
  /albums:
    get:
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Album"}}
        "400":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewAlbum"}
      responses:
        "201":
          content: {application/json: {schema: {$ref: "#/components/schemas/Album"}}}
        "400":
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  /albums/{album_id}:
    get:
      parameters:
        - {name: album_id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          content: {application/json: {schema: {$ref: "#/components/schemas/Album"}}}
        "404":
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
components:
  schemas:
    Album:
      type: object
      required: [id, title, artist, year]
      additionalProperties: false
      properties:
        id: {type: integer}
        title: {type: string}
        artist: {type: string}
        year: {type: integer}
    NewAlbum:
      type: object
      required: [title, artist, year]
      additionalProperties: false
      properties:
        title: {type: string}
        artist: {type: string}
        year: {type: integer}
    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error: {type: string}
        message: {type: string}
